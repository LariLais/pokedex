<app-header></app-header>

<main>
  <section class="section-hero">
    <div class="hero-inner container">
      <div class="hero-content">
        <h1 class="titulo">Busque seu Pokémon favorito</h1>

        <p class="subtitulo">
          Explore a Pokédex, descubra tipos e encontre qualquer Pokémon pelo
          nome ou ID.
        </p>

        <a class="cta" [routerLink]="link"> Procurar Pokémon </a>
      </div>

      <div class="hero-illustration">
        <img
          src="https://www.pngplay.com/wp-content/uploads/11/Pikachu-Pokemon-PNG-Photo-Image.png"
          alt="Pikachu"
        />
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
