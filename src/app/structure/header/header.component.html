<header class="site-header">
  <nav>
    <div class="nav-inner">
      <div class="logo">
        <a routerLink="/home" aria-label="Ir para o início"><span class="logo-mark">P</span><span class="logo-copy">Pokédex<span>.</span></span></a>
      </div>

      <div class="nav-links">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Início</a>
        <a routerLink="/list" routerLinkActive="active">Pokémon</a>
        <a routerLink="/types" routerLinkActive="active">Tipos</a>
      </div>

      <div class="title" *ngIf="titulo"><span class="title-dot"></span>{{ titulo }}</div>
    </div>
  </nav>
</header>
