<app-header [titulo]="titulo"></app-header>

<main class="page">
  <section class="types-section">
    <ul class="simbols-list">
      <li
        class="poke-simbol"
        *ngFor="let tipo of tipos"
        (click)="buscarPokemonDoTipo(tipo.id)"
      >
        <img [src]="tipo.img" [title]="tipo.nome" />
      </li>
    </ul>
  </section>

  <div *ngIf="carregando" class="loading">Carregando pokémons...</div>

  <section class="content">
    <div class="card" *ngFor="let pokemon of paginaAtual">
      <a [routerLink]="['/detail', pokemon.id]">
        <div class="card-body">
          <img
            *ngIf="pokemon?.imageDefault"
            [src]="pokemon.imageDefault"
            [alt]="pokemon.name"
          />
          <h2>{{ pokemon.name }}</h2>
        </div>
      </a>
    </div>
  </section>

  <nav class="botoes">
    <button (click)="primeiraPagina()" [disabled]="habilitaPrimeiraPagina()">
      &#171;
    </button>
    <button (click)="anteriorPagina()" [disabled]="habilitaRetrocesso()">
      &lt;
    </button>
    <button (click)="proximaPagina()" [disabled]="habilitaAvanco()">
      &gt;
    </button>
    <button (click)="ultimaPagina()" [disabled]="habilitaUltimaPagina()">
      &#187;
    </button>
  </nav>
</main>

<app-footer></app-footer>
