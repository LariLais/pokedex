<app-header></app-header>

<main class="page">
  <section class="container">
    <h1 class="titulo">Busque o Pokémon por ID ou nome</h1>

    <form class="search" (ngSubmit)="buscar()" autocomplete="off">
      <input
        [(ngModel)]="pokemonProcurado"
        name="pokemonProcurado"
        placeholder="Ex: pikachu ou 25"
        class="input"
      />

      <button type="submit" class="btn primary">Buscar</button>

      <button type="button" (click)="randomPokemon()" class="btn">
        Surpreenda-me
      </button>

      <button type="button" (click)="mostrarHistorico()" class="btn">
        {{ funcao }}
      </button>
    </form>

    <div class="mensagem" *ngIf="mensagem">
      {{ mensagem }}
    </div>

    <div class="resultado" *ngIf="pokemonEncontrado?.id">
      <a [routerLink]="['/detail', pokemonEncontrado.id]">
        <img [src]="imagem" [alt]="pokemonEncontrado.nome" />
        <h2>{{ pokemonEncontrado.nome }}</h2>
        <span>#{{ pokemonEncontrado.id }}</span>
      </a>
    </div>

    <div class="historico" *ngIf="mostrarHist">
      <h2>Histórico de pesquisa</h2>

      <div class="historico-list">
        <div *ngFor="let item of historico">
          <a [routerLink]="['/detail', item.id]">
            #{{ item.id }} - {{ item.nome }}
          </a>
        </div>
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
